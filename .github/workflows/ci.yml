name: Metal Inference checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '1788566400'
      METAL_INFERENCE_PORTABLE_TESTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: python -m pip install --require-hashes --only-binary=:all: -r policy/ci-bootstrap.txt
      - run: uv sync --locked --group dev
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -m 'not metal'
      - run: uv run --frozen python tools/check_dependencies.py
      - run: uv run --frozen python tools/check_inputs.py
      - run: uv build --sdist
      - name: Source SPDX artifact
        run: |
          for artifact in dist/*.tar.gz; do
            uv run --frozen python tools/sbom.py "$artifact" --epoch "$SOURCE_DATE_EPOCH" --out "$artifact.spdx.json"
          done
  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, metal-inference]
    timeout-minutes: 20
    env:
      METAL_INFERENCE_TEST: '1'
      SOURCE_DATE_EPOCH: '1788566400'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # The dedicated runner provides pinned Python/uv/Xcode and local model bytes.
      - run: uv sync --locked --group dev
      - run: uv run --frozen pytest --cov --cov-report=xml --cov-report=term-missing
      - run: uv build
      - run: uv run --frozen python tools/check_dependencies.py --installed
      # Native publication, attestation and longer qualification are separate.
